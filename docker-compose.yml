version: '3.8'

services:
  bidsetu-ocr:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bidsetu_paddleocr_service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=info
      - USE_GPU=false
      - USE_ANGLE_CLS=true
      - MAX_FILE_SIZE_MB=50
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
